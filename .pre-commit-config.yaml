fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: check-file-pair
        name: check-file-pair
        language: system
        entry: uv tool run devobs check-file-pair
        pass_filenames: false
        args:
          - --from=django_slack_tools
          - --to=tests
          - --include=*.py
          - --exclude=errors.py,**/migrations/*.py,*.py
          - --expect={to}/{relative_from}/test_{filename}
          - --create-if-not-exists

      - id: ruff-check
        name: ruff check
        language: system
        types: [python]
        entry: uv run ruff check
        args: [--fix]

      - id: ruff-format
        name: ruff format
        language: system
        types: [python]
        entry: uv run ruff format

      - id: mypy
        name: mypy
        language: system
        types: [python]
        pass_filenames: false
        entry: uv run mypy
        args: [--show-error-codes, --pretty, .]

      - id: django-migration
        name: check django migrations
        language: system
        types: [python]
        pass_filenames: false
        entry: uv run python manage.py makemigrations
        args: [--check, --dry-run]

      - id: pytest
        name: pytest
        language: system
        types: [python]
        pass_filenames: false
        entry: uv run pytest # Not running full tests (nox) in pre-commit for quick feedback
